[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-fock-nd-core"
version = "0.3.0"
description = "General n-dimensional valuation arithmetic, log-gcd graph, and stability core"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["prime_fock_nd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
